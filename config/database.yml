# config/database.yml

# 1. DEFAULT SETTINGS
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "password") %>

# 2. DEVELOPMENT
development:
  <<: *default
  database: short_link_development

# 3. TEST
test:
  <<: *default
  database: short_link_test

# 4. PRODUCTION (The Fix)
# Rails 8 requires 'primary', 'cable', 'queue', and 'cache' keys.
# We map them ALL to the same DATABASE_URL from Render.
production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["DATABASE_URL"] %>

  cable:
    <<: *primary_production

  queue:
    <<: *primary_production

  cache:
    <<: *primary_production
